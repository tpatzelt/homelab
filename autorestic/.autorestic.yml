version: 2

# The repo password is NOT set here: autorestic does not expand ${VARS} in
# the key field (it would use the literal string as the password). It comes
# from AUTORESTIC_BACKUP_HDD_RESTIC_PASSWORD in secrets/.autorestic.env.
backends:
  backup-hdd:
    type: local
    path: /mnt/backup/restic-backups

global:
  forget:
    keep-last: 5
    keep-weekly: 8
    keep-monthly: 12
    keep-yearly: 5

locations:
  my-data:
    from: /mnt/storage/data
    to: backup-hdd
    forget: prune 

  docker-data:
    from: /opt/dockerdata
    to: backup-hdd
    forget: prune 
    # djcc's PCM cache is many GB of regenerable data: every record in the
    # crate is decoded once to raw float32 and memory-mapped so deck loads
    # never wait on a decoder. That is ~150 MB per record (~16 GB for the
    # current crate) and `djcc scan` rebuilds all of it from the MP3s, which
    # are themselves backed up under /mnt/storage/data. The analysis index
    # next to it (/opt/dockerdata/djcc/data/library.json) is NOT excluded — it
    # is small and holds the hours of analysis that the cache is merely a
    # byproduct of.
    options:
      backup:
        exclude:
          - /opt/dockerdata/djcc/data/pcm
    hooks:
      before:
        - echo "Generating list of containers to stop..."
        # Skip --rm containers: `docker stop` deletes them, so the `after` hook's
        # strict `docker start` would fail on a container that no longer exists and
        # turn a good backup into a false alert (happened 2026-08-13 with an
        # ephemeral birthday-bash-e2e left running overnight). `if`/`fi` rather than
        # `&&` so a trailing skipped container can't make the hook itself exit 1.
        - docker ps --format '{{.Names}}' | grep -vE '^(pihole)$' | while read -r c; do if [ "$(docker inspect -f '{{.HostConfig.AutoRemove}}' "$c")" = "false" ]; then echo "$c"; fi; done > /tmp/backup_containers.list
        - if [ -s /tmp/backup_containers.list ]; then docker stop $(cat /tmp/backup_containers.list); fi
      
      after:
        - if [ -s /tmp/backup_containers.list ]; then docker start $(cat /tmp/backup_containers.list) || true; fi
        - sleep 5
        # Strict pass, but existence-aware: a container removed while the backup ran
        # (an ephemeral compose/test stack torn down by its own tooling — e.g. the
        # annabel-rene-baum playwright suite) is skipped rather than failing the run,
        # the same false alert --rm containers used to cause. A container that still
        # exists but refuses to start sets fail=1 and still alerts, so real breakage
        # is not masked.
        - if [ -s /tmp/backup_containers.list ]; then fail=0; while read -r c; do if docker inspect "$c" >/dev/null 2>&1; then docker start "$c" >/dev/null || fail=1; else echo "skipping $c (removed while the backup ran)"; fi; done < /tmp/backup_containers.list; [ "$fail" -eq 0 ]; fi
        - rm -f /tmp/backup_containers.list
      
      failure:
        - if [ -s /tmp/backup_containers.list ]; then docker start $(cat /tmp/backup_containers.list) || true; fi
        - sleep 5
        # Strict pass, but existence-aware: a container removed while the backup ran
        # (an ephemeral compose/test stack torn down by its own tooling — e.g. the
        # annabel-rene-baum playwright suite) is skipped rather than failing the run,
        # the same false alert --rm containers used to cause. A container that still
        # exists but refuses to start sets fail=1 and still alerts, so real breakage
        # is not masked.
        - if [ -s /tmp/backup_containers.list ]; then fail=0; while read -r c; do if docker inspect "$c" >/dev/null 2>&1; then docker start "$c" >/dev/null || fail=1; else echo "skipping $c (removed while the backup ran)"; fi; done < /tmp/backup_containers.list; [ "$fail" -eq 0 ]; fi
        - rm -f /tmp/backup_containers.list

  secrets:
    from: /home/tim/coding/homelab/secrets
    to: backup-hdd
    forget: prune