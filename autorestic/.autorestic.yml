version: 2

# The repo password is NOT set here: autorestic does not expand ${VARS} in
# the key field (it would use the literal string as the password). It comes
# from AUTORESTIC_BACKUP_HDD_RESTIC_PASSWORD in secrets/.autorestic.env.
backends:
  backup-hdd:
    type: local
    path: /mnt/backup/restic-backups

  # Offsite copy in Google Drive via restic's rclone backend. "gdrive:" is the
  # rclone remote configured under root at /root/.config/rclone/rclone.conf
  # (cron runs as root). Same password caveat as above: it arrives via
  # AUTORESTIC_GDRIVE_RESTIC_PASSWORD in secrets/.autorestic.env, not here.
  # The repo is client-side encrypted, so Google only ever holds an encrypted
  # blob. autorestic does NOT auto-init: run `restic init` on it once manually.
  gdrive:
    type: rclone
    path: gdrive:restic-offsite

global:
  forget:
    keep-last: 5
    keep-weekly: 8
    keep-monthly: 12
    keep-yearly: 5

locations:
  my-data:
    from: /mnt/storage/data
    to: backup-hdd
    forget: prune 

  docker-data:
    from: /opt/dockerdata
    to:
      - backup-hdd
      - gdrive
    forget: prune
    hooks:
      before:
        - echo "Generating list of containers to stop..."
        - docker ps --format '{{.Names}}' | grep -vE '^(pihole)$' > /tmp/backup_containers.list
        - if [ -s /tmp/backup_containers.list ]; then docker stop $(cat /tmp/backup_containers.list); fi
      
      after:
        - if [ -s /tmp/backup_containers.list ]; then docker start $(cat /tmp/backup_containers.list) || true; fi
        - sleep 5
        - if [ -s /tmp/backup_containers.list ]; then docker start $(cat /tmp/backup_containers.list); fi
        - rm -f /tmp/backup_containers.list
      
      failure:
        - if [ -s /tmp/backup_containers.list ]; then docker start $(cat /tmp/backup_containers.list) || true; fi
        - sleep 5
        - if [ -s /tmp/backup_containers.list ]; then docker start $(cat /tmp/backup_containers.list); fi
        - rm -f /tmp/backup_containers.list

  secrets:
    from: /home/tim/coding/homelab/secrets
    to:
      - backup-hdd
      - gdrive
    forget: prune

  # Offsite-only locations: these paths are already covered on the HDD by the
  # my-data location (/mnt/storage/data), so here they go to gdrive only. This
  # is the hand-picked irreplaceable subset — the rest of /mnt/storage/data
  # (Games/Media/ISOs) is replaceable and stays HDD-only.
  offsite-immich:
    from: /mnt/storage/data/Immich
    to: gdrive
    forget: prune

  offsite-docs:
    from: /mnt/storage/data/Docs
    to: gdrive
    forget: prune

  offsite-handy:
    from: /mnt/storage/data/Handy-Dumps
    to: gdrive
    forget: prune