services:
  caddy:
    # Custom Caddy build with Cloudflare DNS module for ACME DNS challenge
    image: caddy-cloudflare
    build: .
    restart: unless-stopped
    container_name: caddy
    env_file: ./.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CROWDSEC_BOUNCER_API_KEY=${CROWDSEC_BOUNCER_API_KEY}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /opt/dockerdata/caddy/data:/data
      - /opt/dockerdata/caddy/config:/config
      - /opt/dockerdata/caddy/logs:/var/log/caddy

    depends_on:
      crowdsec:
        condition: service_healthy
    healthcheck:
      # Probes the admin API (localhost-only, port 2019); 127.0.0.1 because
      # busybox wget prefers ::1 and the admin endpoint is IPv4-only.
      # /config/admin (a 5-byte `null`), not /config/: --spider hangs up after
      # the headers, and with the whole config as the body ~15% of checks
      # logged a broken-pipe 500 in admin.api.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/admin"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # homeassistant runs with network_mode: host
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - caddy_network
      - public_network

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.2
    container_name: crowdsec
    restart: unless-stopped
    environment:
      - GID=1000
      - COLLECTIONS=crowdsecurity/caddy crowdsecurity/base-http-scenarios crowdsecurity/http-cve crowdsecurity/linux
    volumes:
      - /opt/dockerdata/crowdsec/config:/etc/crowdsec
      - /opt/dockerdata/crowdsec/data:/var/lib/crowdsec/data
      - /opt/dockerdata/caddy/logs:/var/log/caddy:ro   # Caddy's access log
      - /var/log:/var/log/host:ro                       # for linux/sshd scenarios
    healthcheck:
      test: ["CMD", "cscli", "version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - caddy_network

networks:
  caddy_network:
    external: true
    name: caddy_network
  public_network:
    external: true
    name: public_network
