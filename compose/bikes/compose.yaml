# Wie Berlin radelt: nextbike availability collector, nightly site rebuild and
# static server in one container (app: github.com/tpatzelt/berlin-bike-data).
# The image runs as uid 10001, so /opt/dockerdata/bikes must be owned by it.
services:
  bikes:
    # Rolling tag published by the app repo's CI. To roll back, pin sha-<short>.
    image: ghcr.io/tpatzelt/berlin-bike-data:latest
    container_name: bikes
    restart: unless-stopped
    env_file: ./.env
    environment:
      # Paths inside the container; these win over anything in .env.
      BIKES_DATA_DIR: /data/parquet
      BIKES_SITE_DIR: /data/site
    volumes:
      - /opt/dockerdata/bikes:/data
    networks:
      - caddy_network

networks:
  caddy_network:
    external: true
    name: caddy_network
