services:
  # VPN container - all *arr services use network_mode: service:gluetun to route traffic through VPN
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    env_file: ./.env
    container_name: gluetun
    cap_add:
      - NET_ADMIN  # Required for VPN tunnel management
    devices:
      - /dev/net/tun:/dev/net/tun
    # No ports published: gluetun's HTTPPROXY and SHADOWSOCKS are both off, so
    # 8888/8388 published nothing but an open-looking listener on 0.0.0.0 that
    # any LAN device could probe. The *arr web UIs are not affected — they are
    # reached through Caddy over caddy_network, not via published host ports.
    # If a proxy is ever wanted, re-add the port *and* enable it in .arr.env.
    environment:
      - VPN_SERVICE_PROVIDER=airvpn
      - SERVER_COUNTRIES=Netherlands
      # Allow containers on gluetun_network to reach the VPN tunnel
      - FIREWALL_OUTBOUND_SUBNETS=172.60.0.0/24
      # Port forwarding for torrents (must match qBittorrent listening port)
      - FIREWALL_VPN_INPUT_PORTS=49906
      - VPN_IPV6=off
    volumes:
      - /opt/dockerdata/gluetun:/gluetun
    restart: unless-stopped
    networks:
      - gluetun_network
      - caddy_network

  qbittorrent:
    # libtorrentv1 line: matches the libtorrent 1.2.x this config was written
    # by, so existing .fastresume files load without a forced full recheck.
    image: lscr.io/linuxserver/qbittorrent:5.2.4-libtorrentv1
    container_name: qbittorrent
    env_file: ./.env
    environment:
      - WEBUI_PORT=8081
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /opt/dockerdata/qbittorrent:/config
      - /mnt/storage/plexmedia:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:8081"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    env_file: ./.env
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /opt/dockerdata/sonarr:/config
      - /mnt/storage/plexmedia:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8989/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    container_name: radarr
    env_file: ./.env
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /opt/dockerdata/radarr:/config
      - /mnt/storage/plexmedia:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7878/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy

  lidarr:
    image: lscr.io/linuxserver/lidarr:8.1.2135
    container_name: lidarr
    env_file: ./.env
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /opt/dockerdata/lidarr:/config
      - /mnt/storage/plexmedia:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:8686/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.2
    container_name: bazarr
    env_file: ./.env
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /opt/dockerdata/bazarr:/config
      - /mnt/storage/plexmedia:/data
    healthcheck:
      # bazarr has no unauthenticated /ping, so probe the web root
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:6767"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5
    container_name: prowlarr
    env_file: ./.env
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /opt/dockerdata/prowlarr:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9696/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy

  # Exportarr: one per app (lidarr is left out: its API 500s on /artist and
  # /history over a corrupt quality profile in its DB, so it would only ever
  # export collector errors), turning each *arr's API into Prometheus metrics
  # (library size, missing/wanted, queue, health issues) for the Media
  # dashboard. They read the API key straight out of the app's config.xml
  # (mounted read-only), so no key is copied into an env file. Unlike the apps
  # themselves they are NOT in gluetun's netns: they only talk to gluetun:<port>
  # over caddy_network, never to the internet, so the anti-leak depends_on rule
  # above does not apply.
  sonarr-exporter:
    <<: &exportarr
      image: ghcr.io/onedr0p/exportarr:v2.3.0
      restart: unless-stopped
      networks:
        - caddy_network
    container_name: sonarr-exporter
    command: ["sonarr"]
    environment:
      PORT: 9707
      URL: http://gluetun:8989
      CONFIG: /app/config/config.xml
      ENABLE_ADDITIONAL_METRICS: "true"
    volumes:
      - /opt/dockerdata/sonarr:/app/config:ro

  radarr-exporter:
    <<: *exportarr
    container_name: radarr-exporter
    command: ["radarr"]
    environment:
      PORT: 9708
      URL: http://gluetun:7878
      CONFIG: /app/config/config.xml
      ENABLE_ADDITIONAL_METRICS: "true"
    volumes:
      - /opt/dockerdata/radarr:/app/config:ro


  prowlarr-exporter:
    <<: *exportarr
    container_name: prowlarr-exporter
    command: ["prowlarr"]
    environment:
      PORT: 9710
      URL: http://gluetun:9696
      CONFIG: /app/config/config.xml
    volumes:
      - /opt/dockerdata/prowlarr:/app/config:ro

networks:
  gluetun_network:
    name: gluetun_network
    ipam:
      config:
        - subnet: 172.60.0.0/24

  caddy_network:
    external: true
    name: caddy_network
