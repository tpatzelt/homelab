services:
  romm:
    # Self-hosted ROM manager: scans the library, scrapes metadata, serves
    # downloads and in-browser play. Redis/Valkey is embedded in the full
    # image, so /redis-data must be persisted or in-flight tasks are lost.
    container_name: romm
    image: rommapp/romm:5.0.0
    env_file: ./.env
    environment:
      - TZ=${TZ}
      - ROMM_BASE_URL=${ROMM_BASE_URL}
      - DB_HOST=romm-db
      - DB_NAME=${ROMM_DB_NAME}
      - DB_USER=${ROMM_DB_USER}
      - DB_PASSWD=${ROMM_DB_PASSWORD}
      - ROMM_AUTH_SECRET_KEY=${ROMM_AUTH_SECRET_KEY}
      # Hasheous needs no account and covers hash-based matching. Add
      # SCREENSCRAPER_USER/PASSWORD, IGDB_CLIENT_ID/SECRET or
      # STEAMGRIDDB_API_KEY to secrets/.romm.env to widen coverage.
      - HASHEOUS_API_ENABLED=true
    volumes:
      - /mnt/storage/data/Games/romm/library:/romm/library
      - /opt/dockerdata/romm/resources:/romm/resources
      - /opt/dockerdata/romm/assets:/romm/assets
      - /opt/dockerdata/romm/config:/romm/config
      - /opt/dockerdata/romm/redis:/redis-data
    depends_on:
      romm-db:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/heartbeat"]
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
      - caddy_network

  romm-db:
    # MariaDB backing store for RomM
    container_name: romm-db
    image: mariadb:12.3.2
    env_file: ./.env
    environment:
      - MARIADB_ROOT_PASSWORD=${ROMM_DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${ROMM_DB_NAME}
      - MARIADB_USER=${ROMM_DB_USER}
      - MARIADB_PASSWORD=${ROMM_DB_PASSWORD}
    volumes:
      - /opt/dockerdata/romm/mariadb:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  caddy_network:
    external: true
    name: caddy_network
