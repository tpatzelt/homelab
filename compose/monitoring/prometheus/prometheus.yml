global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          instance: homelab

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: caddy
    static_configs:
      - targets: ["caddy:2020"]

  - job_name: crowdsec
    static_configs:
      - targets: ["crowdsec:6060"]

  - job_name: cloudflared
    static_configs:
      - targets: ["cloudflared:2000"]

  # App-level stats for the Media & Apps dashboard. The exportarr and
  # pihole-exporter containers live in the arr / core stacks (they need those
  # stacks' config and secrets); navidrome serves its own /metrics.
  - job_name: arr
    static_configs:
      - targets: ["sonarr-exporter:9707", "radarr-exporter:9708", "prowlarr-exporter:9710"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^-]+)-exporter:.*"
        target_label: instance
    # exportarr walks the whole library over the API on every scrape
    scrape_interval: 2m
    scrape_timeout: 60s

  - job_name: pihole
    static_configs:
      - targets: ["pihole-exporter:9617"]
        labels:
          instance: pihole

  - job_name: navidrome
    static_configs:
      - targets: ["navidrome:4533"]
        labels:
          instance: navidrome

  # One probe per service, against the same upstream Caddy proxies to (the
  # *arr apps sit behind gluetun's netns, so they are probed as gluetun:<port>).
  # Targets are written "service=url"; `service` is what the dashboards show,
  # so keep this list in step with the Caddyfile when adding or removing a
  # route. A group may override the blackbox module via __param_module.
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - labels: {stack: core}
        targets:
          - beszel=http://beszel:8090/api/health
          - dozzle=http://dozzle:8080/healthcheck
          - heimdall=http://heimdall:80
      - labels: {stack: core, __param_module: http_2xx_insecure}
        targets:
          - pihole=https://pihole:443/admin/
      - labels: {stack: arr}
        targets:
          - qbittorrent=http://gluetun:8081
          - sonarr=http://gluetun:8989/ping
          - radarr=http://gluetun:7878/ping
          - lidarr=http://gluetun:8686/ping
          - bazarr=http://gluetun:6767
          - prowlarr=http://gluetun:9696/ping
      - labels: {stack: media}
        targets:
          - jellyfin=http://jellyfin:8096/health
          - immich=http://immich-server:2283/api/server/ping
          - navidrome=http://navidrome:4533/ping
          - seerr=http://seerr:5055/api/v1/status
          - djcc=http://djcc:8765/api/state
      - labels: {stack: utilities}
        targets:
          - vaultwarden=http://vaultwarden:80/alive
          - filebrowser=http://filebrowser:80/health
          - karakeep=http://karakeep:3000/api/health
          - ip-tracker=http://ip-tracker:8000
          - job-agent=http://job-agent:8765
          - orca=http://orca:6768/web-index.html
          - nightshift=http://nightshift-web:8080/api/health
      - labels: {stack: public}
        targets:
          - annabel-rene=http://annabel-rene-frontend:4321
          - birthday-bash=http://birthday-bash:80
          - pendel=http://pendel-web:8000/healthz
          - bikes=http://bikes:8080/healthz
      - labels: {stack: infra}
        targets:
          - caddy=http://caddy:2020/metrics
          - crowdsec=http://crowdsec:8080/health
          - cloudflared=http://cloudflared:2000/ready
          - grafana=http://grafana:3000/api/health
      # goaccess's port speaks only WebSocket (plain HTTP gets a 400)
      - labels: {stack: infra, __param_module: tcp_connect}
        targets:
          - goaccess=goaccess:7890
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^=]+)=(.+)"
        target_label: service
        replacement: "$1"
      - source_labels: [__address__]
        regex: "([^=]+)=(.+)"
        target_label: __param_target
        replacement: "$2"
      - source_labels: [service]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
