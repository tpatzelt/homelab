services:
  birthday-bash:
    image: ghcr.io/tpatzelt/birthday-bash:${BIRTHDAY_BASH_IMAGE_TAG}
    container_name: birthday-bash
    restart: unless-stopped
    # This site is reachable from the internet, so it sits on public_network
    # with Caddy and the other public sites only. It cannot reach any
    # internal service.
    networks:
      - public_network

networks:
  public_network:
    external: true
    name: public_network
