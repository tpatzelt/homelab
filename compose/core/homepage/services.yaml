---
# One tile per Caddy route. `href` is the address a browser uses; the domain
# comes from HOMEPAGE_VAR_DOMAIN so the real one stays out of the repo.
# `siteMonitor` is what Homepage itself polls for the up/down dot: the same
# container address Caddy proxies to (gluetun:<port> for the *arr apps).
# The public sites are the exception: they live on public_network, which this
# container does not join, so they are checked through their public URL, the
# whole way out through Cloudflare and back in through the tunnel.
#
# App widgets (Pi-hole, Immich, the *arr apps, Jellyfin) are left out on
# purpose: each needs an API key. Add them one at a time, with the key in
# secrets/.core.env as HOMEPAGE_VAR_<NAME>_KEY.

- Home:
    - Home Assistant:
        icon: home-assistant.png
        href: https://homeassistant.dev.{{HOMEPAGE_VAR_DOMAIN}}
        description: Home automation
        siteMonitor: http://host.docker.internal:8123/manifest.json

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.dev.{{HOMEPAGE_VAR_DOMAIN}}
        description: Movies and shows
        siteMonitor: http://jellyfin:8096/health
    - Navidrome:
        icon: navidrome.png
        href: https://navidrome.dev.{{HOMEPAGE_VAR_DOMAIN}}
        description: Music
        siteMonitor: http://navidrome:4533/ping
    - Immich:
        icon: immich.png
        href: https://immich.dev.{{HOMEPAGE_VAR_DOMAIN}}
        description: Photos
        siteMonitor: http://immich-server:2283/api/server/ping
    - Seerr:
        icon: seerr.png
        href: https://seerr.dev.{{HOMEPAGE_VAR_DOMAIN}}
        description: Media requests
        siteMonitor: http://seerr:5055/api/v1/status

