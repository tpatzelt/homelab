services:
  dozzle:
    # Log viewer. It has no docker socket of its own: it talks to
    # dozzle-socket-proxy below, which passes only the read calls a log viewer
    # needs. Shell and actions are off as well, so there is nothing for them
    # to call. The basic_auth on its Caddy route stays: container logs carry
    # tokens and personal data.
    container_name: dozzle
    image: amir20/dozzle:v11.4.3
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://dozzle-socket-proxy:2375
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"
    depends_on:
      dozzle-socket-proxy:
        condition: service_healthy
    healthcheck:
      # Scratch image, no shell — dozzle ships its own healthcheck command
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - caddy_network
      - dozzle_socket

  dozzle-socket-proxy:
    # The only container that mounts the docker socket for Dozzle. A `:ro`
    # socket mount does not limit the API (read-only applies to the socket
    # file, not to the calls sent through it), so the limit is this allowlist:
    # GET on ping, version, info, events, the container list, and per-container
    # inspect, logs and stats. Every other path and every other method (POST,
    # DELETE, PUT: start, stop, exec, create, pull) gets a 403. It is not on
    # caddy_network; only Dozzle shares dozzle_socket with it, and -allowfrom
    # refuses any other caller even there.
    container_name: dozzle-socket-proxy
    image: wollomatic/socket-proxy:1.13.2
    restart: unless-stopped
    # The image's unprivileged user, plus the host's docker group so it can
    # open the socket.
    user: "65534:${DOCKER_GID}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -allowfrom=dozzle
      - -allowhealthcheck
      - -watchdoginterval=300
      - -shutdowngracetime=5
      # The proxy anchors each regex with ^ and $ itself, and matches the
      # path without the query string.
      - -allowGET=/(v1\.[0-9]{1,2}/)?(_ping|version|info|events|containers/json|containers/[a-zA-Z0-9_.-]+/(json|logs|stats))
      - -allowHEAD=/(v1\.[0-9]{1,2}/)?_ping
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dozzle_socket

  pihole:
    # Network-wide ad blocking DNS server
    container_name: pihole
    image: pihole/pihole:2026.11.0
    env_file: ./.env
    restart: unless-stopped
    ports:
      - "53:53/tcp"      # DNS TCP
      - "53:53/udp"      # DNS UDP
    environment:
      PIHOLE_DNS_1: 8.8.8.8      # Upstream DNS (Google)
      PIHOLE_DNS_2: 8.8.4.4      # Upstream DNS fallback
      FTLCONF_dns_listeningMode: 'all'
      FTLCONF_webserver_api_password: '${PIHOLE_FTLCONF_webserver_api_password}'
      PIHOLE_UID: '${PUID}'
      PIHOLE_GID: '${PGID}'
    dns:
      - 127.0.0.1
    volumes:
      - /opt/dockerdata/pihole:/etc/pihole
    cap_add:
      - NET_ADMIN   # Required for DHCP and network interface management
      - SYS_TIME    # Required for time-based filtering rules
      - SYS_NICE    # Allows setting process priorities for better performance
    networks:
      - caddy_network

  pihole-exporter:
    # DNS stats (queries, blocked share, top clients/domains) for Grafana.
    # Lives in this stack rather than monitoring so it can interpolate the
    # Pi-hole password from core's .env instead of keeping a second copy.
    container_name: pihole-exporter
    image: ekofr/pihole-exporter:v1.3.1
    restart: unless-stopped
    environment:
      # Pi-hole's web/API listens only on 443 with its own self-signed cert
      # (the blackbox probe uses http_2xx_insecure for the same reason).
      PIHOLE_PROTOCOL: https
      PIHOLE_HOSTNAME: pihole
      PIHOLE_PORT: 443
      SKIP_TLS_VERIFICATION: "true"
      PIHOLE_PASSWORD: '${PIHOLE_FTLCONF_webserver_api_password}'
      PORT: 9617
      # Per-API-call timeout (default 5s). A collection that overruns the
      # handler's 10s budget wedges v1.2.0 until restart (see
      # scripts/pihole-exporter-watchdog.sh); failing slow calls fast keeps
      # collections well under it. Healthy calls take ~0.1s. The image is
      # FROM scratch, so a compose healthcheck is not possible — the
      # watchdog cron job is what restarts it.
      TIMEOUT: 2s
    depends_on:
      - pihole
    networks:
      - caddy_network

  homepage:
    # Dashboard. Its whole configuration is the YAML in ./homepage, mounted
    # read-only as a directory (never single files: see the inode trap in
    # CLAUDE.md). No docker socket: the tiles are static entries with
    # siteMonitor, so this container holds no credentials at all.
    #
    # It runs as ${PUID}:${PGID} from the start and deliberately has no
    # env_file: with PUID unset in its environment the image's entrypoint
    # skips every chown and mkdir it would otherwise attempt on the config
    # mount, and the Pi-hole password in core's .env stays out of it.
    # LOG_TARGETS=stdout stops it writing config/logs/homepage.log, which is
    # the only thing it would otherwise write into the repo directory.
    # The image's /app/.next cache is owned by uid 1000; a different PUID
    # would lose the page cache (it still serves).
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:v2.8.0
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    environment:
      # Its Caddy host name, plus the container address the blackbox probe
      # uses. Any other Host header gets a 400.
      HOMEPAGE_ALLOWED_HOSTS: home.dev.${DOMAIN},homepage:3000
      HOMEPAGE_VAR_DOMAIN: ${DOMAIN}
      LOG_TARGETS: stdout
    volumes:
      - ./homepage:/app/config:ro
    healthcheck:
      # The image's own check, restated so the interval matches the others.
      # 127.0.0.1 is always an allowed host.
      test: ["CMD", "wget", "-q", "--spider", "-Y", "off", "http://127.0.0.1:3000/api/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - caddy_network

networks:
  caddy_network:
    external: true
    name: caddy_network
  # Dozzle and its socket proxy, nothing else. internal: no route out.
  dozzle_socket:
    name: dozzle_socket
    internal: true
